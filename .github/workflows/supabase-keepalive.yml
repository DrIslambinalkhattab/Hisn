# يمنع إيقاف مشروع Supabase المجاني بعد أسبوع خمول (بيعمل استدعاء خفيف كل يومين).
# يعتمد على الدالة public.ping() الموجودة في schema.sql
# الإعداد: GitHub repo > Settings > Secrets and variables > Actions > New repository secret
#   SUPABASE_URL      = https://xxxx.supabase.co
#   SUPABASE_ANON_KEY = الـ anon/publishable key (آمن، نفس اللي في الموقع)
name: supabase-keepalive
on:
  schedule:
    - cron: '17 3 */2 * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call public.ping() عبر REST
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 -X POST \
            "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code"
          # 200 = تمام. 401/404 = المفتاح غلط أو schema.sql ما اتشغّلش.
          [ "$code" = "200" ] || { echo "::error::keepalive failed ($code)"; exit 1; }
