<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js" defer></script>
<style>
:root{--bg:#0a0f0d;--s1:#111916;--s2:#17211d;--ln:rgba(255,255,255,.08);--tx:#eef2ee;--mu:#8a978f;--ac:#d4b46a;--ac2:#3fae8a;--sh:0 20px 50px -20px rgba(0,0,0,.7);--gl:rgba(10,15,13,.7)}
:root[data-theme="light"]{--bg:#f6f4ee;--s1:#fff;--s2:#efece3;--ln:rgba(20,32,27,.1);--tx:#14201b;--mu:#6c7a72;--ac:#9a7a2e;--ac2:#1f7d60;--sh:0 20px 40px -22px rgba(40,50,40,.35);--gl:rgba(246,244,238,.75)}
html{height:100%;scroll-padding-top:calc(76px + env(safe-area-inset-top,0px));scroll-behavior:smooth;-webkit-text-size-adjust:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font-family:Tajawal,system-ui,sans-serif;transition:background .5s,color .5s;overflow-x:hidden;overflow-x:clip}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.glow{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(600px circle at var(--gx,50%) var(--gy,20%),color-mix(in srgb,var(--ac) 12%,transparent),transparent 60%)}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top,0px)) max(clamp(18px,5vw,64px),env(safe-area-inset-right,0px)) 14px max(clamp(18px,5vw,64px),env(safe-area-inset-left,0px));background:var(--gl);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-bottom:1px solid var(--ln)}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:19px}
.brand i{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#0a0f0d;font-size:17px}
.tools{display:flex;gap:8px}
.ib.dg:hover,.ib.dg:active{color:#e5484d;border-color:color-mix(in srgb,#e5484d 55%,var(--ln));background:color-mix(in srgb,#e5484d 10%,var(--s1))}.pbtn.dgb{background:#e5484d;border-color:#e5484d;color:#fff}
.ib{width:42px;height:42px;border-radius:50%;border:1px solid var(--ln);background:var(--s1);display:grid;place-items:center;font-size:15px;transition:.3s;color:var(--mu)}
.ib:hover,.ib.on{color:var(--ac);border-color:var(--ac);transform:translateY(-2px)}
.sun{display:none}[data-theme="light"] .sun{display:block}[data-theme="light"] .moon{display:none}
main{position:relative;z-index:1}
.hero{position:relative;padding:clamp(60px,12vh,140px) clamp(18px,5vw,64px) 40px;text-align:center;overflow:hidden}
.orn{position:absolute;top:50%;left:50%;width:min(900px,140vw);aspect-ratio:1;translate:-50% -52%;opacity:.07;color:var(--ac);animation:spin 120s linear infinite;pointer-events:none}
@keyframes spin{to{rotate:360deg}}
.eyebrow{display:inline-flex;gap:10px;align-items:center;font-size:13px;letter-spacing:.08em;color:var(--ac);border:1px solid var(--ln);padding:8px 16px;border-radius:99px;background:var(--s1)}
h1{margin:26px 0 8px;font-size:clamp(64px,15vw,190px);line-height:1;font-weight:900;letter-spacing:-.02em;background:linear-gradient(180deg,var(--tx) 30%,color-mix(in srgb,var(--tx) 30%,transparent));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{max-width:560px;margin:0 auto 38px;color:var(--mu);font-size:clamp(16px,2vw,19px);line-height:1.9;font-weight:300}
.search{position:relative;max-width:560px;margin:0 auto}
.search input{width:100%;height:62px;border-radius:20px;border:1px solid var(--ln);background:var(--s1);color:var(--tx);font:500 17px Tajawal;padding:0 54px 0 20px;outline:0;box-shadow:var(--sh);transition:.3s}
.search input:focus{border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 15%,transparent)}
.search>i,.search>svg{position:absolute;inset-inline-start:22px;top:50%;translate:0 -50%;width:18px;height:18px;font-size:17px;color:var(--mu);pointer-events:none;z-index:1;transition:.3s}
.search:focus-within>i,.search:focus-within>svg{color:var(--ac)}
.meta{display:flex;justify-content:center;gap:34px;margin-top:34px;color:var(--mu);font-size:14px;flex-wrap:wrap}
.meta b{display:block;color:var(--tx);font-size:28px;font-weight:800}
.note{margin:18px auto 0;font-size:12.5px;color:var(--mu);max-width:520px;display:none}
.note.show{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;padding:20px clamp(18px,5vw,64px) 90px;max-width:1500px;margin:auto}
.card{position:relative;min-height:190px;border-radius:24px;border:1px solid var(--ln);background:var(--s1);padding:24px;text-align:right;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;transition:transform .5s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .4s;opacity:0;translate:0 26px}
.card.in{opacity:1;translate:0 0;transition:opacity .7s calc(var(--i)*40ms),translate .8s calc(var(--i)*40ms) cubic-bezier(.2,.8,.2,1),transform .5s,border-color .3s,box-shadow .4s}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),color-mix(in srgb,var(--ac) 16%,transparent),transparent 70%);opacity:0;transition:.4s}
.card:hover{transform:translateY(-6px);border-color:color-mix(in srgb,var(--ac) 50%,var(--ln));box-shadow:var(--sh)}
.card:hover::before{opacity:1}
.num{position:absolute;left:18px;top:6px;font-size:84px;font-weight:900;line-height:1;color:transparent;-webkit-text-stroke:1px var(--ln);transition:.4s}
.card:hover .num{-webkit-text-stroke-color:var(--ac)}
.card h3{position:relative;margin:56px 0 0;font-size:21px;line-height:1.55;font-weight:700}
.foot{position:relative;display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:20px;font-size:13px;color:var(--mu)}
.foot>span:first-child{white-space:nowrap;font-weight:500;color:var(--tx);display:inline-flex;gap:6px;align-items:center}
.foot .pc{font-variant-numeric:tabular-nums;font-weight:700;font-size:12px;color:var(--ac);min-width:3.2ch;text-align:left;direction:ltr}
.foot .pc.z{color:var(--mu);font-weight:500}
.card.dn .foot .pc,.card.dn .foot>span:first-child i{color:var(--ac2)}
.bar{flex:1;height:4px;border-radius:9px;background:color-mix(in srgb,var(--mu) 28%,transparent);overflow:hidden}
.bar span{display:block;height:100%;width:var(--p,0%);border-radius:9px;background:var(--ac);transition:width .6s}
.card.dn .bar span{background:var(--ac2)}
.fav{position:absolute;right:10px;top:10px;z-index:2;color:var(--mu);font-size:15px;width:44px;height:44px;display:grid;place-items:center;transition:.3s}
.fav:hover,.fav.on{color:var(--ac);scale:1.15}
.empty{grid-column:1/-1;text-align:center;color:var(--mu);padding:60px 0}
/* reader */
#reader{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;transform:translateY(100%);visibility:hidden;transition:transform .7s cubic-bezier(.76,0,.24,1),visibility 0s .7s}
#reader.open{transform:none;visibility:visible;transition:transform .7s cubic-bezier(.76,0,.24,1)}
.rh{position:sticky;top:0;z-index:5;background:var(--gl);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-bottom:1px solid var(--ln);padding:calc(14px + env(safe-area-inset-top,0px)) max(clamp(18px,5vw,64px),env(safe-area-inset-right,0px)) 14px max(clamp(18px,5vw,64px),env(safe-area-inset-left,0px));display:flex;align-items:center;gap:16px}
.rh h2{flex:1;margin:0;font-size:clamp(16px,2.4vw,22px);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnt{position:absolute;left:50%;top:50%;translate:-50% -50%;display:inline-flex;align-items:center;gap:10px;font-size:13px;color:var(--ac);border:1px solid var(--ln);padding:8px 16px;border-radius:99px;background:var(--s1);white-space:nowrap;font-variant-numeric:tabular-nums;box-shadow:0 8px 24px -14px rgba(0,0,0,.5);transition:.4s}
.cnt b{font-size:16px;font-weight:800;color:var(--tx);min-width:1ch;text-align:center}
.cnt em{font-style:normal;color:var(--mu);font-weight:500}
.cnt .of{color:var(--mu)}
.cnt{overflow:hidden;isolation:isolate;padding:9px 18px}
.cnt::before{content:"";position:absolute;inset:0 0 0 auto;z-index:-1;width:var(--p,0%);background:color-mix(in srgb,var(--ac) 32%,transparent);transition:width .8s cubic-bezier(.2,.8,.2,1),background .5s}
.cnt.full::before{background:color-mix(in srgb,var(--ac2) 32%,transparent)}
.rp{display:none}
.cnt .sep{width:2px;height:20px;border-radius:2px;background:color-mix(in srgb,var(--mu) 55%,transparent);text-decoration:none}
.cnt strong{font-size:16px;font-weight:800;color:var(--ac);min-width:3ch;text-align:center}
.cnt.full strong{color:var(--ac2)}

.cnt.full{border-color:var(--ac2);color:var(--ac2)}.cnt.full b{color:var(--ac2)}
.cnt b.pop{animation:pop .35s}@keyframes pop{50%{transform:scale(1.25);color:var(--ac)}}
@media(max-width:720px){.cnt{padding:7px 12px;gap:8px}}
@media(max-width:520px){.rh h2{max-width:26vw}}
.rp{position:absolute;bottom:-1px;right:0;left:0;height:1px;background:var(--ln);pointer-events:none}
.rp::before{content:"";position:absolute;bottom:0;right:0;height:2px;width:var(--p,0%);background:linear-gradient(270deg,var(--ac) 0,var(--ac) 70%,color-mix(in srgb,var(--ac) 25%,transparent));transition:width .9s cubic-bezier(.22,.8,.2,1)}
.rp.full::before{background:var(--ac2)}
.list{max-width:820px;margin:auto;padding:36px 18px calc(120px + env(safe-area-inset-bottom,0px));display:grid;gap:18px}
.dh{border:1px solid var(--ln);background:var(--s1);border-radius:28px;padding:clamp(22px,4vw,40px);box-shadow:var(--sh);transition:.5s;opacity:0;translate:0 30px}
.dh.in{opacity:1;translate:0 0}
.dh.ok{border-color:color-mix(in srgb,var(--ac2) 55%,var(--ln))}
.dh .t{font-size:clamp(22px,3.4vw,32px);line-height:2.15;font-weight:500;white-space:pre-line;text-wrap:pretty}
.dh{padding-bottom:clamp(14px,2.4vw,24px)}
.dh .r{display:flex;align-items:center;justify-content:space-between;margin-top:28px;padding-top:22px;border-top:1px dashed var(--ln);cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:0 0 18px 18px}
.dh .r:active .ct{transform:scale(.9)}
.dh.ok .r{cursor:default}
.acts{display:flex;gap:8px}
.ct{position:relative;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:22px;transition:transform .15s}
.ct:active{transform:scale(.9)}
.ct svg{position:absolute;inset:0;rotate:-90deg;scale:-1 1}
.ct circle{fill:none;stroke-width:3.5}
.ct .bg{stroke:var(--s2)}
.ct .fg{stroke:var(--ac);stroke-linecap:round;stroke-dasharray:213.6;stroke-dashoffset:calc(213.6 - 213.6*var(--k,0));transition:stroke-dashoffset .35s}
.dh.ok .fg{stroke:var(--ac2)}
.ct small{display:block;font-size:11px;font-weight:400;color:var(--mu);margin-top:-2px}
.ct span{text-align:center;line-height:1.1;position:relative}
.toast{max-width:calc(100vw - 32px);text-align:center;position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));translate:-50% 140px;background:var(--s1);border:1px solid var(--ac2);color:var(--tx);padding:14px 24px;border-radius:99px;box-shadow:var(--sh);z-index:80;transition:translate .6s cubic-bezier(.2,.9,.3,1.2);display:flex;gap:10px;align-items:center}
.toast i{color:var(--ac2)}.toast.show{translate:-50% 0}
.sk{height:190px;border-radius:24px;background:linear-gradient(100deg,var(--s1) 40%,var(--s2) 50%,var(--s1) 60%);background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}

/* hide scrollbars everywhere */
html,body,#reader{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar,#reader::-webkit-scrollbar,*::-webkit-scrollbar{display:none;width:0;height:0;background:transparent}
/* touch + mobile polish */
button,.card,.ct,.ib{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
h1{overflow-wrap:anywhere}
.toast{white-space:normal}
@media(hover:none){
  .card:hover{transform:none;box-shadow:none;border-color:var(--ln)}
  .card:hover::before{opacity:0}
  .card:hover .num{-webkit-text-stroke-color:var(--ln)}
  .ib:hover{transform:none;color:var(--mu);border-color:var(--ln)}
  .ib.on:hover{color:var(--ac);border-color:var(--ac)}
  .card:active{transform:scale(.98);border-color:color-mix(in srgb,var(--ac) 50%,var(--ln))}
  .ib:active{color:var(--ac);border-color:var(--ac)}
}
@media(max-width:560px){
  header{padding-bottom:12px}
  .brand{font-size:17px;gap:10px}
  .brand i{width:34px;height:34px;font-size:15px}
  .ib{width:40px;height:40px}
  .hero{padding-top:44px;padding-bottom:28px}
  .meta{gap:26px;margin-top:26px}
  .search input{height:56px;border-radius:18px}
  .grid{grid-template-columns:1fr;gap:12px;padding-bottom:calc(60px + env(safe-area-inset-bottom,0px))}
  .card{min-height:168px;padding:20px;border-radius:22px}
  .card h3{margin-top:48px;font-size:19px}
  .rh{flex-wrap:wrap;row-gap:12px;gap:10px;padding-bottom:12px}
  .rh h2{max-width:none;min-width:0;order:1}
  .rh #back{order:0}.rh #rst{order:2}.rh .thm{order:3}
  .cnt{position:relative;left:auto;top:auto;translate:none;order:4;flex:0 0 100%;justify-content:center;box-shadow:none;padding:9px 14px}
  .rp{bottom:-1px}
  .list{padding-top:20px;gap:14px}
  .dh{border-radius:24px;padding:22px 18px}
  .dh .t{line-height:2.05}
  .dh .r{margin-top:22px;padding-top:18px}
  .ct{width:84px;height:84px}
  .ct svg{width:100%;height:100%}
  .toast{padding:12px 18px;font-size:14px}
}
/* ===== المسبحة ===== */
.tw{position:relative;z-index:1;max-width:1500px;margin:0 auto;padding:0 clamp(18px,5vw,64px)}
.tcta{display:flex;align-items:center;gap:16px;width:100%;padding:18px 22px;border-radius:24px;border:1px solid var(--ln);background:linear-gradient(120deg,color-mix(in srgb,var(--ac) 14%,var(--s1)),var(--s1) 60%);text-align:right;box-shadow:var(--sh);transition:.4s}
.tcta:hover{border-color:var(--ac);transform:translateY(-3px)}
.tcta>i:first-child{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#0a0f0d;font-size:21px}
.tcta div{flex:1}.tcta b{display:block;font-size:19px;font-weight:800}.tcta small{color:var(--mu);font-size:13.5px}
.tcta em{font-style:normal;font-weight:900;color:var(--ac);font-size:24px;font-variant-numeric:tabular-nums;text-align:center;line-height:1}.tcta em small{display:block;font-size:11px;font-weight:500;margin-top:4px}
#tsb{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;transform:translateY(100%);visibility:hidden;scrollbar-width:none;transition:transform .7s cubic-bezier(.76,0,.24,1),visibility 0s .7s}
#tsb.open{transform:none;visibility:visible;transition:transform .7s cubic-bezier(.76,0,.24,1)}
.tabs{display:flex;gap:4px;margin:22px auto 0;width:max-content;max-width:calc(100% - 36px);padding:5px;border-radius:99px;border:1px solid var(--ln);background:var(--s1)}
.tabs button{padding:10px 26px;border-radius:99px;font-weight:700;font-size:15px;color:var(--mu);transition:.35s}.tabs button.on{background:var(--ac);color:#0a0f0d}
.tv{max-width:880px;margin:auto;padding:26px 18px calc(110px + env(safe-area-inset-bottom,0px))}
.tzt{display:flex;align-items:center;justify-content:center;gap:12px;min-height:5.2em;text-align:center;font-size:clamp(22px,4.2vw,32px);line-height:2.05;font-weight:500;text-wrap:balance}
.bead{position:relative;display:block;margin:14px auto 18px;width:min(80vw,340px);aspect-ratio:1;border-radius:50%;transition:scale .15s}
.bead:active{scale:.965}.bead svg{position:absolute;inset:0;width:100%;height:100%}
.bead .d{position:absolute;inset:11%;border-radius:50%;overflow:hidden;display:grid;place-content:center;text-align:center;background:radial-gradient(circle at 35% 25%,color-mix(in srgb,var(--ac) 20%,var(--s1)),var(--s1) 72%);border:1px solid var(--ln);box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.07);transition:box-shadow .5s}
.bead.fl .d{box-shadow:0 0 0 7px color-mix(in srgb,var(--ac2) 28%,transparent),var(--sh)}
.bead .nn{font-size:clamp(64px,19vw,96px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums}.bead .nn.pop{animation:pop .3s}
.bead small{color:var(--mu);font-size:14px;margin-top:8px}
.bead circle.b{fill:var(--s2);stroke:var(--ln);transition:fill .3s,stroke .3s}.bead circle.b.on{fill:var(--ac);stroke:var(--ac)}.bead.fl circle.b.on{fill:var(--ac2);stroke:var(--ac2)}
.rip{position:absolute;width:36px;height:36px;border-radius:50%;pointer-events:none;translate:-50% -50%;background:color-mix(in srgb,var(--ac) 38%,transparent);animation:rpl .6s ease-out forwards}@keyframes rpl{to{scale:8;opacity:0}}
.sp{position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3px;border-radius:50%;background:var(--ac);pointer-events:none;animation:spk .9s cubic-bezier(.2,.8,.2,1) forwards}@keyframes spk{to{transform:rotate(var(--a)) translateY(-190px) scale(.2);opacity:0}}
.tm{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.tm>span{padding:8px 16px;border-radius:99px;border:1px solid var(--ln);background:var(--s1);font-size:13.5px;color:var(--mu)}.tm>span b{color:var(--tx);margin-inline-start:6px;font-variant-numeric:tabular-nums}
.tp{padding:9px 16px;border-radius:99px;border:1px solid var(--ln);background:var(--s1);color:var(--mu);font-size:13.5px;font-weight:700;display:inline-flex;gap:8px;align-items:center;transition:.3s}.tp.on,.tp:hover{color:var(--ac);border-color:var(--ac)}.tp b{color:var(--tx)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:10px;padding:6px 2px 12px;margin-top:10px}.chip small{margin-top:auto}.chip:not(.add):hover{transform:translateY(-2px);box-shadow:0 8px 20px -10px rgba(0,0,0,.25)}
.chip{padding:12px 16px;border-radius:18px;border:1px solid var(--ln);background:var(--s1);text-align:right;min-width:0;min-height:74px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;transition:.3s}
.chip b{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;font-weight:700;font-size:14.5px;line-height:1.55;white-space:normal;overflow:hidden;overflow-wrap:anywhere;text-wrap:balance}.chip small{color:var(--mu);font-size:12px;font-variant-numeric:tabular-nums}
.chip.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,var(--s1))}.chip.add{display:grid;place-items:center;color:var(--ac);border-style:dashed}
.sg{display:grid;gap:14px}.sg>*{animation:up .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}@keyframes up{from{opacity:0;translate:0 20px}}
.pn{border:1px solid var(--ln);background:var(--s1);border-radius:26px;padding:22px;box-shadow:var(--sh)}.pn h4{margin:0 0 4px;font-size:16px;font-weight:800}.pn .hs{color:var(--mu);font-size:12.5px;margin-bottom:16px;line-height:1.7}
